# Same build the Netlify UI already uses, written down so it travels with
# the repo. Functions in netlify/functions power the inquiry form, the
# manager portal API, and the Jarvis reporting API.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# The manager portal: never cached, never indexed, never framed, and only
# allowed to run this site's own scripts and talk to this site's own API.
[[headers]]
  for = "/manager/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
